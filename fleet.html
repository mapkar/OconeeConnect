<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetCom Office – Test</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --panel-2: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --text-dim: #8b9bb4;
      --accent: #3b82f6;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--accent); }
    .badge {
      font-size: 0.7rem;
      background: #334155;
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .dot.offline { background: #64748b; }

    /* Layout */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      overflow: hidden;
    }

    /* Sidebar – Bus List */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .bus-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .bus-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .bus-item:hover { background: var(--panel-2); }
    .bus-item.active { background: #1e3a5f; }
    .bus-item .dot { flex-shrink: 0; }
    .bus-info { flex: 1; min-width: 0; }
    .bus-id { font-weight: 600; font-size: 0.95rem; }
    .bus-meta {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bus-priority {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .bus-priority.high { background: var(--amber); }
    .bus-priority.emergency { background: var(--red); }

    /* Center – Messages */
    .feed {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .feed-toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--panel);
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .msg-card.emergency { border-left: 4px solid var(--red); }
    .msg-card.high { border-left: 4px solid var(--amber); }
    .msg-card.normal { border-left: 4px solid var(--accent); }
    .msg-card.unacked { background: #1c2838; }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 12px;
    }
    .msg-from {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .msg-time {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .msg-text {
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .msg-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--text-dim);
      font-weight: 500;
    }
    .tag.priority-emergency { background: #450a0a; color: #fca5a5; }
    .tag.priority-high { background: #451a03; color: #fcd34d; }
    .tag.priority-normal { background: #1e3a5f; color: #93c5fd; }

    .msg-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-ack { background: var(--green); color: #052e16; }
    .btn-deny { background: #7f1d1d; color: #fecaca; }
    .btn-dismiss { background: var(--panel-2); color: var(--text-dim); }
    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Right – Compose */
    .compose {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .compose-header {
      padding: 14px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .compose-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow-y: auto;
    }
    label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: block;
    }
    select, textarea, input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    select:focus, textarea:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 80px; }
    .compose-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .btn-send {
      width: 100%;
      background: var(--accent);
      color: white;
      padding: 10px;
      font-size: 0.9rem;
    }

    /* Empty state */
    .empty {
      text-align: center;
      color: var(--text-dim);
      padding: 40px 20px;
      font-size: 0.9rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    @media (max-width: 1100px) {
      .main { grid-template-columns: 240px 1fr; }
      .compose { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="logo">Fleet<span>Com</span> Office</div>
      <span class="badge">Test / Demo</span>
    </div>
    <div class="status-pill">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-text">Demo Mode (mock data)</span>
    </div>
  </header>

  <div class="main">
    <!-- Left: Bus List -->
    <aside class="sidebar">
      <div class="sidebar-header">Buses</div>
      <div class="bus-list" id="bus-list"></div>
    </aside>

    <!-- Center: Message Feed -->
    <section class="feed">
      <div class="feed-toolbar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="unacked">Unacked</button>
        <button class="filter-btn" data-filter="high">High / Emergency</button>
        <button class="filter-btn" data-filter="bus">From Buses</button>
      </div>
      <div class="message-list" id="message-list">
        <div class="empty">No messages yet</div>
      </div>
    </section>

    <!-- Right: Compose -->
    <aside class="compose">
      <div class="compose-header">Send Message</div>
      <div class="compose-body">
        <div>
          <label>Target</label>
          <select id="target-bus">
            <option value="broadcast">All Buses (Broadcast)</option>
          </select>
        </div>
        <div>
          <label>Type</label>
          <select id="msg-type">
            <option value="route_adjustment">Route Adjustment</option>
            <option value="skip_stop">Skip Stop</option>
            <option value="reroute">Reroute</option>
            <option value="schedule_change">Schedule Change</option>
            <option value="hold_at_school">Hold at School</option>
            <option value="confirm_count">Confirm Passenger Count</option>
            <option value="confirm_location">Confirm Location / ETA</option>
            <option value="call_office">Call Office When Safe</option>
            <option value="radio_check">Radio Check</option>
            <option value="emergency_return">Emergency – Return to School</option>
            <option value="emergency_hold">Emergency – Hold Position</option>
            <option value="weather_alert">Weather / Safety Alert</option>
            <option value="security_notice">Security Notice</option>
            <option value="general_notice">General Notice</option>
          </select>
        </div>
        <div>
          <label>Priority</label>
          <select id="msg-priority">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="emergency">Emergency</option>
          </select>
        </div>
        <div>
          <label>Message Text</label>
          <textarea id="msg-text" placeholder="Short clear instruction for the driver..."></textarea>
        </div>
      </div>
      <div class="compose-actions">
        <button class="btn btn-send" id="send-btn">Send Message</button>
      </div>
    </aside>
  </div>

  <script>
    // ========== MOCK DATA ==========
    const buses = [
      { id: "12", name: "Bus 12", status: "online", route: "Elementary A", lastSeen: Date.now() - 40000 },
      { id: "27", name: "Bus 27", status: "online", route: "Middle / High", lastSeen: Date.now() - 12000 },
      { id: "05", name: "Bus 05", status: "online", route: "Elementary B", lastSeen: Date.now() - 85000 },
      { id: "33", name: "Bus 33", status: "offline", route: "Special Needs", lastSeen: Date.now() - 920000 },
      { id: "18", name: "Bus 18", status: "online", route: "Elementary C", lastSeen: Date.now() - 22000 },
      { id: "41", name: "Bus 41", status: "online", route: "Middle North", lastSeen: Date.now() - 67000 },
    ];

    let messages = [
      {
        msg_id: "m1",
        timestamp: new Date(Date.now() - 180000).toISOString(),
        sender: "27",
        direction: "bus_to_office",
        priority: "high",
        category: "delay",
        type: "traffic",
        bus_id: "27",
        text: "Heavy traffic on Hwy 123 – estimating 10–12 min late",
        status: "pending",
        payload: { estimated_minutes: 12 }
      },
      {
        msg_id: "m2",
        timestamp: new Date(Date.now() - 320000).toISOString(),
        sender: "office",
        direction: "office_to_bus",
        priority: "high",
        category: "office",
        type: "route_adjustment",
        bus_id: "12",
        text: "Route adjustment – new stop at 123 Main St. Needs pick-up.",
        status: "acked",
        payload: { address: "123 Main St" }
      },
      {
        msg_id: "m3",
        timestamp: new Date(Date.now() - 480000).toISOString(),
        sender: "05",
        direction: "bus_to_office",
        priority: "normal",
        category: "status",
        type: "boarding_complete",
        bus_id: "05",
        text: "Boarding complete – departing school",
        status: "acked"
      },
      {
        msg_id: "m4",
        timestamp: new Date(Date.now() - 60000).toISOString(),
        sender: "18",
        direction: "bus_to_office",
        priority: "emergency",
        category: "student",
        type: "injury_medical",
        bus_id: "18",
        text: "Student medical issue – requesting guidance",
        status: "pending"
      }
    ];

    let currentFilter = "all";
    let selectedBusId = null;

    // ========== RENDER ==========
    function renderBuses() {
      const list = document.getElementById("bus-list");
      const targetSelect = document.getElementById("target-bus");

      // clear existing options except broadcast
      while (targetSelect.options.length > 1) targetSelect.remove(1);

      list.innerHTML = buses.map(b => {
        const pending = messages.some(m => m.bus_id === b.id && m.status === "pending" && m.direction === "bus_to_office");
        const highest = messages
          .filter(m => m.bus_id === b.id && m.status === "pending")
          .sort((a,b) => priorityRank(b.priority) - priorityRank(a.priority))[0];

        // populate select
        const opt = document.createElement("option");
        opt.value = b.id;
        opt.textContent = `${b.name} (${b.route})`;
        targetSelect.appendChild(opt);

        return `
          <div class="bus-item ${selectedBusId === b.id ? "active" : ""}" data-id="${b.id}">
            <div class="dot ${b.status === "online" ? "" : "offline"}"></div>
            <div class="bus-info">
              <div class="bus-id">${b.name}</div>
              <div class="bus-meta">${b.route} · ${timeAgo(b.lastSeen)}</div>
            </div>
            ${highest ? `<div class="bus-priority ${highest.priority}"></div>` : ""}
          </div>
        `;
      }).join("");

      // click handlers
      list.querySelectorAll(".bus-item").forEach(el => {
        el.addEventListener("click", () => {
          selectedBusId = el.dataset.id === selectedBusId ? null : el.dataset.id;
          renderBuses();
          renderMessages();
        });
      });
    }

    function priorityRank(p) {
      return p === "emergency" ? 3 : p === "high" ? 2 : 1;
    }

    function renderMessages() {
      const list = document.getElementById("message-list");
      let filtered = [...messages];

      if (currentFilter === "unacked") filtered = filtered.filter(m => m.status === "pending");
      if (currentFilter === "high") filtered = filtered.filter(m => m.priority === "high" || m.priority === "emergency");
      if (currentFilter === "bus") filtered = filtered.filter(m => m.direction === "bus_to_office");
      if (selectedBusId) filtered = filtered.filter(m => m.bus_id === selectedBusId || m.sender === selectedBusId);

      filtered.sort((a, b) => {
        // unacked first, then priority, then time
        if (a.status === "pending" && b.status !== "pending") return -1;
        if (b.status === "pending" && a.status !== "pending") return 1;
        const pr = priorityRank(b.priority) - priorityRank(a.priority);
        if (pr !== 0) return pr;
        return new Date(b.timestamp) - new Date(a.timestamp);
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">No messages match the current filter</div>`;
        return;
      }

      list.innerHTML = filtered.map(m => {
        const from = m.direction === "bus_to_office" ? `Bus ${m.bus_id}` : "Office";
        const isPending = m.status === "pending";
        return `
          <div class="msg-card ${m.priority} ${isPending ? "unacked" : ""}" data-id="${m.msg_id}">
            <div class="msg-header">
              <div class="msg-from">${from}</div>
              <div class="msg-time">${formatTime(m.timestamp)}</div>
            </div>
            <div class="msg-text">${escapeHtml(m.text)}</div>
            <div class="msg-meta">
              <span class="tag priority-${m.priority}">${m.priority}</span>
              <span class="tag">${m.category} / ${m.type}</span>
              <span class="tag">${m.status}</span>
            </div>
            ${isPending && m.direction === "bus_to_office" ? `
              <div class="msg-actions">
                <button class="btn btn-ack" onclick="ackMessage('${m.msg_id}')">Acknowledge</button>
                <button class="btn btn-deny" onclick="denyMessage('${m.msg_id}')">Deny / Needs Info</button>
                <button class="btn btn-dismiss" onclick="dismissMessage('${m.msg_id}')">Dismiss</button>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    // ========== ACTIONS ==========
    function ackMessage(id) {
      const m = messages.find(x => x.msg_id === id);
      if (m) { m.status = "acked"; renderMessages(); renderBuses(); }
    }
    function denyMessage(id) {
      const m = messages.find(x => x.msg_id === id);
      if (m) { m.status = "denied"; renderMessages(); renderBuses(); }
    }
    function dismissMessage(id) {
      const m = messages.find(x => x.msg_id === id);
      if (m) { m.status = "dismissed"; renderMessages(); renderBuses(); }
    }

    document.getElementById("send-btn").addEventListener("click", () => {
      const target = document.getElementById("target-bus").value;
      const type = document.getElementById("msg-type").value;
      const priority = document.getElementById("msg-priority").value;
      const text = document.getElementById("msg-text").value.trim();

      if (!text) {
        alert("Please enter a message.");
        return;
      }

      const msg = {
        msg_id: "m" + Date.now(),
        timestamp: new Date().toISOString(),
        sender: "office",
        direction: "office_to_bus",
        priority,
        category: "office",
        type,
        bus_id: target === "broadcast" ? null : target,
        text: target === "broadcast" ? `[Broadcast] ${text}` : text,
        status: "pending"
      };

      messages.unshift(msg);
      document.getElementById("msg-text").value = "";
      renderMessages();
      renderBuses();
    });

    // Filter buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderMessages();
      });
    });

    // ========== HELPERS ==========
    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s/60) + "m ago";
      return Math.floor(s/3600) + "h ago";
    }
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // ========== DEMO SIMULATION ==========
    const demoMessages = [
      { bus: "12", priority: "normal", category: "status", type: "all_clear", text: "All clear – on schedule" },
      { bus: "41", priority: "high", category: "delay", type: "waiting_students", text: "Waiting on 3 students at Oak St stop" },
      { bus: "27", priority: "normal", category: "mechanical", type: "warning_light", text: "Check-engine light came on – still mobile" },
      { bus: "05", priority: "high", category: "route", type: "temp_stop_added", text: "Parent requested temporary stop near library" },
      { bus: "18", priority: "normal", category: "status", type: "request_radio", text: "Request radio contact when convenient" },
    ];

    function simulateIncoming() {
      const item = demoMessages[Math.floor(Math.random() * demoMessages.length)];
      const msg = {
        msg_id: "sim" + Date.now(),
        timestamp: new Date().toISOString(),
        sender: item.bus,
        direction: "bus_to_office",
        priority: item.priority,
        category: item.category,
        type: item.type,
        bus_id: item.bus,
        text: item.text,
        status: "pending"
      };
      messages.unshift(msg);

      // update lastSeen
      const bus = buses.find(b => b.id === item.bus);
      if (bus) bus.lastSeen = Date.now();

      renderMessages();
      renderBuses();
    }

    // Start
    renderBuses();
    renderMessages();

    // Simulate a new bus message every 25–45 seconds
    setInterval(() => {
      if (Math.random() > 0.4) simulateIncoming();
    }, 30000);
  </script>
</body>
</html>
