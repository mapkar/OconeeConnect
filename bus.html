<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FleetCom Bus</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #151c27;
      --border: #2a3548;
      --text: #f1f5f9;
      --dim: #94a3b8;
      --accent: #3b82f6;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --btn: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== TOP STATUS BAR ===== */
    .status-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .bus-id {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dim);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
    }
    .dot.warn { background: var(--amber); }
    .dot.off { background: #64748b; }

    /* ===== PENDING MESSAGE ===== */
    .pending {
      background: #1a2332;
      border-bottom: 1px solid var(--border);
      padding: 14px;
      display: none; /* shown when message exists */
    }
    .pending.visible { display: block; }

    .pending-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--amber);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .pending-text {
      font-size: 1.05rem;
      line-height: 1.35;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .pending-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .action-btn {
      border: none;
      border-radius: 10px;
      padding: 14px 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-ack { background: var(--green); color: #052e16; }
    .btn-deny { background: #7f1d1d; color: #fecaca; }
    .btn-dismiss { background: #334155; color: #cbd5e1; }

    /* ===== CATEGORY GRID ===== */
    .categories {
      flex: 1;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
    }

    .cat-btn {
      background: var(--btn);
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      min-height: 0;
    }
    .cat-btn:active {
      background: #334155;
      border-color: var(--accent);
    }
    .cat-btn .icon {
      font-size: 1.6rem;
      line-height: 1;
    }
    .cat-btn.emergency {
      border-color: #7f1d1d;
      background: #1c1010;
      color: #fca5a5;
    }

    /* ===== SECONDARY MENU (slides up) ===== */
    .submenu {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 50;
    }
    .submenu.open { display: flex; }

    .submenu-panel {
      background: var(--panel);
      border-radius: 18px 18px 0 0;
      padding: 16px 14px 28px;
      max-height: 75dvh;
      overflow-y: auto;
    }
    .submenu-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--dim);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .sub-btn {
      width: 100%;
      background: var(--btn);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 16px 14px;
      margin-bottom: 8px;
      text-align: left;
      cursor: pointer;
    }
    .sub-btn:active { background: #334155; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #166534;
      color: #dcfce7;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="bus-id">Bus 27</div>
    <div class="status-right">
      <span id="conn-label">Online</span>
      <div class="dot" id="conn-dot"></div>
    </div>
  </div>

  <!-- Pending message from office -->
  <div class="pending visible" id="pending">
    <div class="pending-label">Pending Message</div>
    <div class="pending-text" id="pending-text">
      Alert – Route adjustment<br>
      New stop: 123 Main St<br>
      Needs pick-up
    </div>
    <div class="pending-actions">
      <button class="action-btn btn-ack" onclick="handleAck()">ACK</button>
      <button class="action-btn btn-deny" onclick="handleDeny()">Deny</button>
      <button class="action-btn btn-dismiss" onclick="handleDismiss()">Dismiss</button>
    </div>
  </div>

  <!-- Main category buttons -->
  <div class="categories">
    <button class="cat-btn" onclick="openSub('student')">
      <span class="icon">👤</span>
      Issue
    </button>
    <button class="cat-btn" onclick="openSub('mechanical')">
      <span class="icon">🔧</span>
      Mech
    </button>
    <button class="cat-btn" onclick="openSub('delay')">
      <span class="icon">⏱</span>
      Delay
    </button>
    <button class="cat-btn" onclick="openSub('route')">
      <span class="icon">🗺</span>
      Route
    </button>
    <button class="cat-btn" onclick="openSub('status')">
      <span class="icon">✓</span>
      Status
    </button>
    <button class="cat-btn emergency" onclick="openSub('emergency')">
      <span class="icon">🚨</span>
      Emergency
    </button>
  </div>

  <!-- Submenu overlay -->
  <div class="submenu" id="submenu">
    <div class="submenu-panel">
      <div class="submenu-title">
        <span id="sub-title">Category</span>
        <button class="close-btn" onclick="closeSub()">✕</button>
      </div>
      <div id="sub-buttons"></div>
    </div>
  </div>

  <div class="toast" id="toast">Message sent</div>

  <script>
    // Message options per category
    const options = {
      student: [
        { type: "behavior", text: "Behavior issue – needs follow-up" },
        { type: "injury_medical", text: "Student injury / medical" },
        { type: "missing_student", text: "Missing student at stop" },
        { type: "extra_rider", text: "Extra / unauthorized rider" },
        { type: "fight", text: "Fight / serious incident" },
        { type: "parent_confrontation", text: "Parent confrontation at stop" }
      ],
      mechanical: [
        { type: "warning_light", text: "Check-engine / warning light" },
        { type: "tire", text: "Tire / flat" },
        { type: "brakes", text: "Brake issue" },
        { type: "door_lift", text: "Door or wheelchair lift problem" },
        { type: "electronics", text: "Camera / radio / tablet failure" },
        { type: "wont_start", text: "Bus not starting / won’t move" },
        { type: "other_mechanical", text: "Other mechanical – needs shop" }
      ],
      delay: [
        { type: "traffic", text: "Traffic / road construction" },
        { type: "weather", text: "Weather / road conditions" },
        { type: "waiting_students", text: "Waiting on students" },
        { type: "mechanical_delay", text: "Mechanical delay (still mobile)" },
        { type: "previous_route_late", text: "Earlier route running late" },
        { type: "other_delay", text: "Other delay – needs radio" }
      ],
      route: [
        { type: "temp_stop_added", text: "Temporary stop added" },
        { type: "temp_stop_removed", text: "Temporary stop removed / skipped" },
        { type: "reroute_road_closed", text: "Reroute – road closed" },
        { type: "reroute_traffic", text: "Reroute – traffic / accident" },
        { type: "extra_stop_school", text: "Extra stop requested by school" },
        { type: "last_stop_complete", text: "Last stop complete – returning" }
      ],
      status: [
        { type: "all_clear", text: "All clear / on schedule" },
        { type: "boarding_complete", text: "Boarding complete" },
        { type: "request_radio", text: "Request radio contact" },
        { type: "request_call", text: "Request phone call from office" },
        { type: "fuel_low", text: "Fuel / range low" },
        { type: "capacity", text: "Bus full / capacity issue" }
      ],
      emergency: [
        { type: "assistance_needed", text: "Immediate assistance needed" },
        { type: "accident", text: "Accident / collision" },
        { type: "medical_emergency", text: "Medical emergency on board" },
        { type: "security_threat", text: "Security threat" }
      ]
    };

    const titles = {
      student: "Student / Behavior",
      mechanical: "Mechanical",
      delay: "Delay",
      route: "Route / Stop",
      status: "Status / Request",
      emergency: "Emergency"
    };

    function openSub(cat) {
      const list = options[cat];
      document.getElementById("sub-title").textContent = titles[cat];
      const container = document.getElementById("sub-buttons");
      container.innerHTML = list.map(o =>
        `<button class="sub-btn" onclick="sendMsg('${cat}', '${o.type}', '${o.text.replace(/'/g, "\\'")}')">${o.text}</button>`
      ).join("");
      document.getElementById("submenu").classList.add("open");
    }

    function closeSub() {
      document.getElementById("submenu").classList.remove("open");
    }

    function sendMsg(category, type, text) {
      console.log("Sending:", { category, type, text });
      closeSub();
      showToast("Sent: " + text);
      // In real version this would publish to MQTT
    }

    function handleAck() {
      document.getElementById("pending").classList.remove("visible");
      showToast("Acknowledged");
    }
    function handleDeny() {
      document.getElementById("pending").classList.remove("visible");
      showToast("Denied – office notified");
    }
    function handleDismiss() {
      document.getElementById("pending").classList.remove("visible");
      showToast("Dismissed");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    // Close submenu if user taps the dark overlay
    document.getElementById("submenu").addEventListener("click", (e) => {
      if (e.target.id === "submenu") closeSub();
    });
  </script>
</body>
</html>
